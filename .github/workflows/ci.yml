name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-time placeholders only; real secrets live in Vercel.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Database automations and security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migration and tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/supabase_stub.sql \
            -f supabase/migrations/0001_init.sql \
            -f supabase/migrations/0002_harden_functions.sql \
            -f supabase/tests/automations_test.sql | tee out.txt
          grep -q "ALL AUTOMATION/RLS TESTS PASSED" out.txt
